<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>StudyFlow Calendar</title>

  <link
    rel="stylesheet"
    href="calendar.css"
  >
</head>

<body>

  <!-- MOBILE SIDEBAR OVERLAY -->

  <div
    id="sidebarOverlay"
    class="sidebar-overlay"
  ></div>


  <div class="dashboard-layout">

    <!-- SIDEBAR -->

    <aside
      class="sidebar"
      id="sidebar"
    >

      <div class="sidebar-top">

        <div class="brand">

          <div class="brand-icon">
            S
          </div>

          <h2>
            StudyFlow
          </h2>

        </div>


        <button
          id="closeSidebar"
          class="close-sidebar-btn"
          type="button"
          aria-label="Close navigation"
        >
          ✕
        </button>

      </div>


      <nav class="nav-menu">

        <a
          href="dashboard.html"
          class="nav-item"
        >
          <span>🏠</span>
          Dashboard
        </a>


        <a
          href="tasks.html"
          class="nav-item"
        >
          <span>📝</span>
          Tasks
        </a>


        <a
          href="assignments.html"
          class="nav-item"
        >
          <span>📚</span>
          Assignments
        </a>


        <a
          href="exams.html"
          class="nav-item"
        >
          <span>📅</span>
          Exams
        </a>


        <a
          href="calendar.html"
          class="nav-item active"
        >
          <span>📆</span>
          Calendar
        </a>


        <a
          href="integrations.html"
          class="nav-item"
        >
          <span>🔗</span>
          Integrations
        </a>


        <a
          href="profile.html"
          class="nav-item"
        >
          <span>👤</span>
          Profile
        </a>

      </nav>


      <button
        id="logoutButton"
        class="logout-btn"
      >
        Logout
      </button>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="main-content">

      <!-- MOBILE HEADER -->

      <div class="mobile-header">

        <button
          id="openSidebar"
          class="mobile-menu-btn"
          type="button"
          aria-label="Open navigation"
        >
          ☰
        </button>


        <div class="mobile-brand">

          <div class="mobile-brand-icon">
            S
          </div>

          <span>
            StudyFlow
          </span>

        </div>

      </div>


      <!-- TOP -->

      <div class="topbar">

        <div>

          <p class="small-text">
            Academic Schedule
          </p>

          <h1>
            Calendar
          </h1>

          <p class="sub-text">
            View your tasks, assignments and exams in one place.
          </p>

        </div>

      </div>


      <!-- LEGEND -->

      <section class="legend-card">

        <div class="legend-item">

          <span class="legend-dot task-dot"></span>

          <span>
            Tasks
          </span>

        </div>


        <div class="legend-item">

          <span class="legend-dot assignment-dot"></span>

          <span>
            Assignments
          </span>

        </div>


        <div class="legend-item">

          <span class="legend-dot exam-dot"></span>

          <span>
            Exams
          </span>

        </div>


        <div class="legend-item">

          <span class="legend-dot overdue-dot"></span>

          <span>
            Overdue
          </span>

        </div>

      </section>


      <!-- CALENDAR CARD -->

      <section class="calendar-card">

        <!-- CONTROLS -->

        <div class="calendar-header">

          <div>

            <p class="small-text">
              Monthly View
            </p>

            <h2 id="monthTitle">
              Calendar
            </h2>

          </div>


          <div class="calendar-controls">

            <button
              id="previousMonth"
              type="button"
            >
              ← Previous
            </button>


            <button
              id="todayButton"
              type="button"
              class="today-btn"
            >
              Today
            </button>


            <button
              id="nextMonth"
              type="button"
            >
              Next →
            </button>

          </div>

        </div>


        <!-- SCROLL WRAPPER -->

        <div class="calendar-scroll">

          <div class="calendar-content">

            <!-- WEEK DAYS -->

            <div class="weekday-grid">

              <div>Sun</div>
              <div>Mon</div>
              <div>Tue</div>
              <div>Wed</div>
              <div>Thu</div>
              <div>Fri</div>
              <div>Sat</div>

            </div>


            <!-- DAYS -->

            <div
              id="calendarGrid"
              class="calendar-grid"
            ></div>

          </div>

        </div>

      </section>

    </main>

  </div>


  <script src="calendar.js"></script>

</body>

</html>
